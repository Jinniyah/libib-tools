[project]
name = "libibtools"
version = "0.1.0"
description = "Scrape Chirp, Kindle, and Kobo libraries and export Libib-compatible CSVs"
authors = [{ name = "Jennifer M" }]
requires-python = ">=3.10"

[tool.setuptools]
packages = [
    "chirp_to_libib",
    "kindle_to_libib",
    "kobo_to_libib",
    "nook_to_libib",
    "libib_reconcile",
    "webapp",
    "lib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["chirp_to_libib", "nook_to_libib", "libib_reconcile", "webapp"]
omit = [
    "chirp_to_libib/__main__.py",
    "chirp_to_libib/core.py:_build_driver",
    "chirp_to_libib/core.py:_login",
    "chirp_to_libib/core.py:scrape_chirp",
    "chirp_to_libib/core.py:main",
    "nook_to_libib/__main__.py",
    "nook_to_libib/core.py:_build_driver",
    "nook_to_libib/core.py:_login",
    "nook_to_libib/core.py:scrape_nook",
    "nook_to_libib/core.py:main",
    "libib_reconcile/__main__.py",
    "libib_reconcile/core.py:main",
    "webapp/__main__.py",
    "webapp/main.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
